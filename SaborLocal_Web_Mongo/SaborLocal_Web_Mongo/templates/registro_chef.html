{% extends "base.html" %}
{% block title %}Registro Chef — SaborLocal{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-6">
    <div class="bg-fondo-tarjeta border border-fondo-borde rounded-lg p-8 shadow-2xl">
        
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <span class="text-[10px] font-serif uppercase tracking-widest text-dorado block mb-1">Socios Culinarios</span>
            <h2 class="text-2xl font-serif text-plateado-claro tracking-wide uppercase">Registrar Restaurante</h2>
            <p class="text-xs text-plateado-oscuro mt-2 tracking-widest uppercase">
                Inicie sesión de inmediato para configurar su menú y publicar su establecimiento.
            </p>
        </div>

        <!-- Formulario -->
        <form method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Su nombre completo</label>
                <input type="text" name="nombre" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="Ej: Chef Carlos Mendoza">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Correo electrónico</label>
                    <input type="email" name="correo" required 
                           class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                           placeholder="chef@restaurante.com">
                </div>

                <div>
                    <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Contraseña</label>
                    <input type="password" name="contrasena" required minlength="4"
                           class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                           placeholder="••••••••">
                </div>
            </div>

            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Nombre del restaurante</label>
                <input type="text" name="nombre_restaurante" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="Ej: Bistro Gourmand">
            </div>

            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Dirección del establecimiento</label>
                <input type="text" name="direccion" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="Ej: Calle 10 # 4-20, Centro Histórico">
            </div>

            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Descripción (opcional)</label>
                <textarea name="descripcion" rows="3" 
                          class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm resize-none"
                          placeholder="Reseña o concepto gastronómico de su propuesta..."></textarea>
            </div>

            <button type="submit" class="w-full bg-dorado hover:bg-dorado-brillante text-fondo-puro font-serif font-bold uppercase tracking-widest text-xs py-3.5 rounded transition-colors shadow-lg mt-4">
                Registrar Restaurante
            </button>
        </form>

        <!-- Pie del formulario -->
        <div class="mt-8 pt-6 border-t border-fondo-borde text-center">
            <p class="text-xs text-plateado-oscuro mb-3">¿Ya posee una cuenta registrada?</p>
            <a href="{{ url_for('login') }}" class="inline-block border border-plateado-oscuro text-plateado hover:border-dorado hover:text-dorado text-xs font-serif uppercase tracking-widest px-6 py-2 rounded transition-colors">
                Iniciar Sesión
            </a>
        </div>

    </div>
</div>
{% endblock %}
