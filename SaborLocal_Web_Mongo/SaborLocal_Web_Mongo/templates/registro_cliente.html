{% extends "base.html" %}
{% block title %}Registro de Cliente — SaborLocal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6">
    <div class="bg-fondo-tarjeta border border-fondo-borde rounded-lg p-8 shadow-2xl">
        
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <span class="text-[10px] font-serif uppercase tracking-widest text-dorado block mb-1">Membresía Exclusiva</span>
            <h2 class="text-2xl font-serif text-plateado-claro tracking-wide uppercase">Crear Cuenta</h2>
            <p class="text-xs text-plateado-oscuro mt-2 tracking-widest uppercase">Únase a la experiencia SaborLocal</p>
        </div>

        <!-- Formulario -->
        <form method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Nombre completo</label>
                <input type="text" name="nombre" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="Ej: Juan Pérez">
            </div>

            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Correo electrónico</label>
                <input type="email" name="correo" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="ejemplo@correo.com">
            </div>

            <div>
                <label class="block text-xs font-serif uppercase tracking-widest text-dorado mb-2">Contraseña</label>
                <input type="password" name="contrasena" required 
                       class="w-full px-4 py-3 bg-fondo-puro border border-fondo-borde rounded focus:ring-1 focus:ring-dorado focus:border-dorado outline-none transition-all text-plateado-claro placeholder-plateado-oscuro font-light text-sm"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-dorado hover:bg-dorado-brillante text-fondo-puro font-serif font-bold uppercase tracking-widest text-xs py-3.5 rounded transition-colors shadow-lg mt-4">
                Registrarme
            </button>
        </form>

        <!-- Pie del formulario -->
        <div class="mt-8 pt-6 border-t border-fondo-borde text-center">
            <p class="text-xs text-plateado-oscuro mb-3">¿Ya posee una cuenta registrada?</p>
            <a href="{{ url_for('login') }}" class="inline-block border border-plateado-oscuro text-plateado hover:border-dorado hover:text-dorado text-xs font-serif uppercase tracking-widest px-6 py-2 rounded transition-colors">
                Iniciar Sesión
            </a>
        </div>

    </div>
</div>
{% endblock %}
